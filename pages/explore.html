<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png">
   <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png">
   <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png">
   <link rel="manifest" href="../favicon/site.webmanifest">
   <link rel="stylesheet" href="../fonts/stylesheet.css" />
   <link rel="stylesheet" href="../css/style.css" />
   <link rel="stylesheet" href="../css/explore.css" />
   <script src="https://unpkg.com/lucide@latest"></script>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
   <title>Explore National Parks & Sanctuaries | Wildlife India</title>
</head>

<body>

   <div id="top"></div>

   <div id="headerPlaceholder"></div>

   <div id="overlay" aria-hidden="true" onclick="closeSidebar()"></div>

   <main class="main">
      <section class="searchbox-container">
         <div id="wrapper">
            <h3>Explore National Parks & Sanctuaries</h3>
            <div class="search-and-filters">
               <div class="search">
                  <input type="text" id="searchPark" placeholder="Search by name or location..." />
               </div>
               <div class="filters">
                  <select name="State" id="stateFilter">
                     <option value="all" selected>All states</option>
                  </select>
               </div>
            </div>
         </div>
      </section>

      <section id="exploreGallery">
         <div id="wrapper"></div>
      </section>
   </main>
   
   <div id="footerPlaceholder"></div>

   <div class="floating-btn">
      <a href="#top"><i data-lucide="circle-arrow-up"></i></a>
   </div>

   <script src="../js/nav.js" defer></script>
   <script src="../js/script.js" defer></script>
   <script type="module" src="../js/gallery.js" defer></script>
   <script>
      lucide.createIcons();
   </script>
</body>

</html>
